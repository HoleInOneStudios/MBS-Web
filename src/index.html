<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marching Band Drill Creator and Viewer" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="./image/favicon-32x32.png" />
    <script src="./scripts/mbs.js" type="module"></script>
    <title>MBS - Web</title>
  </head>
  <body>
    <header class="site-header"><h1 id="showTitle">Test Show</h1></header>
    <main class="app-main">
      <div class="workspace">
        <section class="panel info-bar" aria-label="Show and field information">
          <div class="info-grid show-info">
            <div class="info-item"><span>Previous Set</span><output id="prevSet">0</output></div>
            <div class="info-item"><span>Current Set</span><output id="currentSet">0</output></div>
            <div class="info-item"><span>Next Set</span><output id="nextSet">0</output></div>
            <div class="info-item"><span>Count</span><output id="count">0</output></div>
            <div class="info-item"><span>Tempo</span><output id="tempo">0 BPM</output></div>
            <div class="info-item"><span>Speed</span><output id="speed">x1</output></div>
          </div>
          <div class="info-grid field-info">
            <div class="info-item mouse-position"><span>Mouse Position</span><output id="mouseX">0</output><output id="mouseY">0</output></div>
          </div>
        </section>
        <section class="field-area" aria-label="Marching field">
          <canvas id="canvas" aria-label="Marching field"><p>Your browser does not support the HTML5 canvas tag.</p></canvas>
        </section>
        <aside class="side-panel">
          <section class="panel" aria-labelledby="controls-heading">
            <h2 id="controls-heading">Controls</h2>
            <h3>Show</h3>
            <div class="control-grid">
              <label for="showTitleInput">Title</label><input type="text" id="showTitleInput" value="Test Show" />
            </div>
            <h3>Field</h3>
            <div id="fieldControls" class="control-grid">
              <label for="fieldType">Field</label><select id="fieldType"><option value="NCAA">NCAA</option><option value="High School">High School</option><option value="NFL">NFL</option></select>
              <label for="bgColor">Background</label><input type="color" id="bgColor" value="#009900" />
              <label for="lnColor">Line</label><input type="color" id="lnColor" value="#ffffff" />
              <label for="lnWidth">Line Size</label><input type="range" id="lnWidth" min="5" max="15" value="10" />
            </div>
            <h3>Simulation</h3>
            <div class="control-grid">
              <label for="tempoControl">Tempo</label><input type="number" id="tempoControl" min="40" max="240" value="120" />
              <label for="speedControl">Speed</label><input type="number" id="speedControl" min="0.25" step="0.25" value="1" />
              <label for="moveCountControl">Move Count</label><input type="number" id="moveCountControl" min="1" step="1" />
              <label for="moveStepSizeControl">Move Step Size</label><select id="moveStepSizeControl"><option value="0.625">8 to 5</option><option value="0.8333333333">6 to 5</option><option value="0.4166666667">12 to 5</option><option value="0.3125">16 to 5</option></select>
              <label for="move">Move</label><input type="checkbox" id="move" checked />
              <label for="path">Paths</label><input type="checkbox" id="path" />
            </div>
            <h3>Players</h3>
            <div class="control-grid">
              <label for="playerSelect">Selected Player</label><select id="playerSelect"></select>
              <label for="playerId">ID</label><input type="text" id="playerId" placeholder="T1" />
              <label for="playerName">Name</label><input type="text" id="playerName" placeholder="Trumpet 1" />
              <label for="playerColor">Color</label><input type="color" id="playerColor" value="#ff0000" />
              <button type="button" id="addPlayer">Add Player</button><button type="button" id="removePlayer">Remove Player</button>
            </div>
          </section>
        </aside>
      </div>
      <section class="panel import-export" aria-labelledby="import-export-heading">
        <h2 id="import-export-heading">Import / Export</h2>
        <div class="control-grid">
          <button type="button" id="import">Import</button><button type="button" id="export">Export</button>
          <textarea id="exportText" class="full-width" aria-label="Drill JSON">{}</textarea>
          <label class="full-width" for="importFile">Import JSON file</label><input class="full-width" type="file" id="importFile" accept=".json" />
          <button type="button" id="download" class="full-width">Download</button>
        </div>
      </section>
    </main>
  </body>
</html>
