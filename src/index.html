<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="keywords" content="Marching band, drill" />
    <meta name="description" content="Marching Band Drill Creator and Viewer" />
    <meta name="author" content="Benjamin Bowles" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="./image/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./image/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./image/favicon-16x16.png" />

    <script src="./scripts/mbs.js" type="module"></script>
    <title>MBS - Web</title>
  </head>

  <body>
    <header class="site-header">
      <h1>Marching Band Simulator - Web Edition</h1>
    </header>

    <main class="app-main">
      <section class="field-area" aria-label="Marching field">
        <canvas id="canvas" aria-label="Marching field">
          <p>Your browser does not support the HTML5 canvas tag.</p>
        </canvas>
      </section>

      <div id="controls" aria-label="Simulator controls">
        <section id="fieldControls" class="controls" aria-labelledby="field-controls-heading">
          <h2 id="field-controls-heading">Field Controls</h2>
          <div class="control-grid">
            <label for="bgColor">Background</label>
            <input type="color" id="bgColor" value="#009900" />
            <label for="lnColor">Line</label>
            <input type="color" id="lnColor" value="#ffffff" />
            <label for="lnWidth">Line Size</label>
            <input type="range" id="lnWidth" min="5" max="15" value="10" />
            <label for="fieldType">Field</label>
            <select id="fieldType">
              <option value="NCAA">NCAA</option>
              <option value="High School">High School</option>
              <option value="NFL">NFL</option>
            </select>
            <label for="stepSize">Step Size</label>
            <select id="stepSize">
              <option value="0.625">8 to 5</option>
              <option value="0.8333333333">6 to 5</option>
              <option value="0.4166666667">12 to 5</option>
            </select>
          </div>
        </section>

        <section id="fieldInfo" class="controls" aria-labelledby="field-info-heading">
          <h2 id="field-info-heading">Field Info</h2>
          <div class="control-grid">
            <span>Chart Location</span>
            <output id="mouseX">0</output>
            <span>Coordinates</span>
            <output id="mouseY">0</output>
          </div>
        </section>

        <section id="objControls" class="controls" aria-labelledby="object-controls-heading">
          <h2 id="object-controls-heading">Object Controls</h2>
          <div class="control-grid">
            <label for="objSelect">Selected Object</label>
            <select id="objSelect"></select>
            <button type="button" id="addObj">Add</button>
            <button type="button" id="removeObj">Remove</button>
          </div>
        </section>

        <section id="simInfo" class="controls" aria-labelledby="simulation-info-heading">
          <h2 id="simulation-info-heading">Simulation Info</h2>
          <div class="control-grid">
            <span>Previous Set</span>
            <output id="prevSet">0</output>
            <span>Current Set</span>
            <output id="currentSet">0</output>
            <span>Next Set</span>
            <output id="nextSet">0</output>
            <span>Count</span>
            <output id="count">0</output>
            <span>Interval</span>
            <output id="interval">0</output>
          </div>
        </section>

        <section id="simControls" class="controls" aria-labelledby="simulation-controls-heading">
          <h2 id="simulation-controls-heading">Simulation Controls</h2>
          <div class="control-grid">
            <label for="intervalControl">Interval</label>
            <input type="range" id="intervalControl" min="1" max="10" value="1" />
            <label for="countControl">Count</label>
            <input type="range" id="countControl" />
            <label for="move">Move</label>
            <input type="checkbox" id="move" checked />
            <label for="path">Paths</label>
            <input type="checkbox" id="path" />
          </div>
        </section>

        <section id="importExport" class="controls" aria-labelledby="import-export-heading">
          <h2 id="import-export-heading">Import / Export</h2>
          <div class="control-grid">
            <button type="button" id="import">Import</button>
            <button type="button" id="export">Export</button>
            <label class="sr-only" for="exportText">Drill JSON</label>
            <textarea id="exportText" class="full-width">{}</textarea>
            <label class="full-width" for="importFile">Import JSON file</label>
            <input class="full-width" type="file" id="importFile" accept=".json" />
            <button type="button" id="download" class="full-width">Download</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
